<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도형 코딩봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/game.css">
<style>
body{--accent:#10a37f;--accent-2:#4fd6aa;--accent-dark:#087a5d;--accent-soft:#dff6ee;--night:#0b2a26;--paper-2:#eefaf5;--veil:linear-gradient(180deg,rgba(6,30,26,.05),rgba(6,30,26,.5))}
/* 모눈 무대 */
.board-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.board-wrap>*{min-width:0}
.board{width:100%;height:auto;display:block;border-radius:18px;background:#f4fbf8;box-shadow:inset 0 0 0 2px rgba(8,122,93,.25)}
.board .gl{stroke:rgba(8,122,93,.18);stroke-width:1}
.board .ruler{font:700 11px var(--f-num);fill:#6aa392}
.pc{fill:url(#pcGrad);stroke:#065c46;stroke-width:2.5;stroke-linejoin:round}
.ghost{fill:rgba(255,194,61,.18);stroke:#e09a00;stroke-width:3;stroke-dasharray:8 6;stroke-linejoin:round}
.eye-w{fill:#fff}.eye-b{fill:#0b2a26}
.ghost-eye{fill:none;stroke:#e09a00;stroke-width:2.5;stroke-dasharray:4 3}
.pos,.orient,.squash{transition:transform .45s cubic-bezier(.4,.1,.2,1.1);transform-box:view-box;transform-origin:0 0}
.no-anim .pos,.no-anim .orient,.no-anim .squash{transition:none}
.flagimg{pointer-events:none}
.wall-hit{animation:shake .4s}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;padding:8px;border-radius:16px;background:#0f3a33;align-content:flex-start}
.prog:empty::before{content:"블록을 눌러 코드를 만드세요";color:#8cc9b6;font-weight:700;font-size:14px;padding:8px}
.blk{border:0;border-radius:12px;padding:7px 12px;font-weight:800;font-size:15px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.blk.slide{background:#2f80ed}.blk.flip{background:#e0458f}.blk.rot{background:#f08c00}
.blk.run{outline:3px solid var(--gold);transform:translateY(-2px) scale(1.06)}
.blk .x{opacity:.7;font-size:12px}
.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.palette .blk{justify-content:center}
.pal-title{font-size:13px;font-weight:800;color:var(--ink-3);margin:8px 0 4px}
.nstep{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink-2);margin-bottom:4px}
.nstep button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:900;font-size:18px}
.nstep b{font-family:var(--f-num);font-size:22px;color:#2f80ed;min-width:24px;text-align:center}
.run-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.console{display:flex;gap:8px;align-items:center;margin-top:10px;background:#0f3a33;border-radius:16px;padding:6px 6px 6px 14px}
.console span{color:#7fe3c2;font-family:ui-monospace,Menlo,monospace;font-weight:700}
.console input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-size:16px;padding:8px 0;outline:none}
.console input::placeholder{color:#6fa596}
.console button{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;padding:8px 14px}
.cmdlbl{font-size:13px;color:var(--ink-3);margin-top:6px}
.opt-svg{width:100%;height:auto;display:block}
.pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pick-grid .choice{padding:8px}
.orig{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.orig svg{width:150px;height:150px}
.orig .act{font-family:var(--f-title);font-size:24px;color:var(--accent-dark);background:var(--accent-soft);border-radius:16px;padding:8px 16px}
.selrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.selrow .choice{min-height:48px;padding:8px 16px;flex:0 0 auto}
.selrow .choice.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark)}
.sentence{font-family:var(--f-title);font-size:clamp(20px,2.6vw,26px);background:var(--paper-2);border-radius:16px;padding:10px 16px;display:inline-block;margin:6px 0}
.sentence b{color:var(--accent-dark)}
/* 각도 */
.angle-svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto;border-radius:18px;background:linear-gradient(180deg,#0f3a33,#145247)}
.aim-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.aim-row .deg{font-family:var(--f-num);font-weight:700;font-size:34px;color:var(--accent-dark);min-width:100px;text-align:center}
.aim-row button.adj{border:3px solid var(--line);background:#fff;border-radius:14px;min-width:58px;min-height:48px;font-weight:900;font-family:var(--f-num);font-size:18px}
.geo{width:100%;max-width:520px;height:auto;display:block;margin:0 auto 10px}
.geo .shape{fill:rgba(16,163,127,.14);stroke:#087a5d;stroke-width:3;stroke-linejoin:round}
.geo text{font:700 20px var(--f-num);fill:#0b2a26}
.geo .q{fill:#e5484d}
@media (max-width:820px){ .board-wrap{grid-template-columns:1fr} }
@media (max-width:560px){ .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .orig svg{width:110px;height:110px} .blk{font-size:14px;padding:6px 10px} }
</style>
</head>
<body>
<script src="../assets/game.js"></script>
<script>
(function(){
const {rand, pick, shuffle, esc} = Game;
const A = '../assets/';
const W = 8, H = 6, C = 50; // 모눈 8×6, 한 칸 50px = 1 cm
const SHAPES = {
  L:{cells:[[0,0],[0,1],[0,2],[1,2]], eye:[0,0]},
  P:{cells:[[0,0],[1,0],[0,1],[1,1],[0,2]], eye:[1,0]},
  F:{cells:[[1,0],[2,0],[0,1],[1,1],[1,2]], eye:[2,0]},
  G:{cells:[[0,0],[1,0],[2,0],[2,1],[2,2]], eye:[0,0]}
};
/* ---------- 도형 변환 (방향 = 뒤집기 f, 시계 방향 90° 회전 r) ---------- */
function tf([x,y], f, r){ if(f) x = 2-x; for(let k=0;k<r;k++){ [x,y] = [2-y, x]; } return [x,y]; }
function cellsOf(st){ const sh = SHAPES[st.shape]; return sh.cells.map(c=>tf(c, st.f, st.r)).map(([x,y])=>[x+st.x, y+st.y]); }
function eyeOf(st){ const [x,y] = tf(SHAPES[st.shape].eye, st.f, st.r); return [x+st.x, y+st.y]; }
function key(st){ return cellsOf(st).map(c=>c.join(',')).sort().join(';') + '|' + eyeOf(st).join(','); }
const CMD = {
  up:{t:'slide', dx:0, dy:-1, name:'위쪽으로 밀기'}, down:{t:'slide', dx:0, dy:1, name:'아래쪽으로 밀기'},
  left:{t:'slide', dx:-1, dy:0, name:'왼쪽으로 밀기'}, right:{t:'slide', dx:1, dy:0, name:'오른쪽으로 밀기'},
  fh:{t:'flip', name:'오른쪽으로 뒤집기', icon:'⇆'}, fv:{t:'flip', name:'위쪽으로 뒤집기', icon:'⇅'},
  cw90:{t:'rot', name:'시계 방향 90°', icon:'↻'}, cw180:{t:'rot', name:'시계 방향 180°', icon:'↻'}, ccw90:{t:'rot', name:'시계 반대 방향 90°', icon:'↺'}
};
const ARROW = {up:'↑', down:'↓', left:'←', right:'→'};
function apply(st, b){
  const s = {...st}; const c = CMD[b.c];
  if(c.t==='slide'){ s.x += c.dx*b.n; s.y += c.dy*b.n; }
  else if(b.c==='fh'){ s.f ^= 1; s.r = (4-s.r)%4; }
  else if(b.c==='fv'){ s.f ^= 1; s.r = (6-s.r)%4; }
  else if(b.c==='cw90') s.r = (s.r+1)%4; else if(b.c==='cw180') s.r = (s.r+2)%4; else if(b.c==='ccw90') s.r = (s.r+3)%4;
  return s;
}
const inside = s => s.x>=0 && s.y>=0 && s.x<=W-3 && s.y<=H-3;
function bfs(start, goalKey, allowed){
  const q=[[start,0]], seen=new Set([key(start)+start.x+','+start.y]);
  while(q.length){ const [s,d]=q.shift(); if(key(s)===goalKey) return d;
    for(const c of allowed){ const ns = CMD[c].t==='slide' ? [1,2,3,4,5].map(n=>({c,n})) : [{c,n:1}];
      for(const b of ns){ const t = apply(s,b); if(!inside(t)) continue; const k = key(t)+t.x+','+t.y; if(seen.has(k)) continue; seen.add(k); q.push([t,d+1]); } } }
  return 99;
}
function blockLabel(b){ const c = CMD[b.c]; return c.t==='slide' ? `${ARROW[b.c]} ${c.name.replace('으로 밀기','')} ${b.n}칸` : `${c.icon} ${c.name}`; }

/* ---------- 그리기 ---------- */
function pieceSVG(st, cls='pc', withEye=true){
  const sh = SHAPES[st.shape];
  const cells = sh.cells.map(([x,y])=>`<rect x="${x*C}" y="${y*C}" width="${C}" height="${C}" rx="7" class="${cls}"/>`).join('');
  const [ex,ey] = sh.eye;
  const eye = withEye ? (cls==='pc' ? `<circle cx="${ex*C+C*0.5}" cy="${ey*C+C*0.5}" r="13" class="eye-w"/><circle cx="${ex*C+C*0.58}" cy="${ey*C+C*0.45}" r="6" class="eye-b"/>` : `<circle cx="${ex*C+C*0.5}" cy="${ey*C+C*0.5}" r="12" class="ghost-eye"/>`) : '';
  return cells + eye;
}
function orientT(st){ return `translate(${1.5*C}px,${1.5*C}px) rotate(${st.r*90}deg) scale(${st.f?-1:1},1) translate(${-1.5*C}px,${-1.5*C}px)`; }
function staticPiece(st, cls){ // SVG 변환 속성으로 (애니메이션 없이)
  return `<g transform="translate(${st.x*C},${st.y*C}) translate(${1.5*C},${1.5*C}) rotate(${st.r*90}) scale(${st.f?-1:1},1) translate(${-1.5*C},${-1.5*C})">${pieceSVG(st, cls)}</g>`;
}
function gridSVG(w=W, h=H, ruler=true){
  let g=''; for(let i=0;i<=w;i++) g+=`<line class="gl" x1="${i*C}" y1="0" x2="${i*C}" y2="${h*C}"/>`; for(let j=0;j<=h;j++) g+=`<line class="gl" x1="0" y1="${j*C}" x2="${w*C}" y2="${j*C}"/>`;
  if(ruler) g += `<text class="ruler" x="${w*C-4}" y="${h*C-6}" text-anchor="end">한 칸 = 1 cm</text>`;
  return g;
}
const DEFS = `<defs><linearGradient id="pcGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fe0b4"/><stop offset="1" stop-color="#10a37f"/></linearGradient></defs>`;

/* ---------- 코딩 무대 위젯 ---------- */
function codingWidget(box, api, {start, goal, allowed, minBlocks, note}){
  const goalKey = key(goal); let prog = [], nSlide = 1, cur = {...start}, running = false;
  box.innerHTML = `<div class="board-wrap">
    <div><svg class="board" viewBox="-4 -4 ${W*C+8} ${H*C+8}" aria-label="모눈 무대">${DEFS}${gridSVG()}
      <g>${staticPiece(goal,'ghost')}</g>
      <image class="flagimg" href="${A}bot/flag.webp" x="${(goal.x+2.2)*C}" y="${(goal.y-0.55)*C}" width="${C*0.9}" height="${C*0.9}"/>
      <g class="pos"><g class="squash"><g class="orient">${pieceSVG(start)}</g></g></g></svg>
      <p class="cmdlbl">점선 = 목표 자리 · 초록 조각에 <b>눈</b>이 있으니 방향을 잘 보세요${minBlocks?` · 최소 <b>${minBlocks}</b>블록으로 가능`:''}</p></div>
    <div><div class="pal-title">내 코드</div><div class="prog" id="prog"></div>
      <div class="run-row"><button class="jbtn good sm" type="button" id="runBtn">▶ 실행</button><button class="jbtn white sm" type="button" id="clrBtn">↺ 지우기</button></div>
      <div class="pal-title">블록</div>
      ${allowed.some(c=>CMD[c].t==='slide')?`<div class="nstep">밀 칸 수 <button type="button" id="nMinus" aria-label="칸 수 줄이기">−</button><b id="nVal">1</b><button type="button" id="nPlus" aria-label="칸 수 늘리기">+</button></div>`:''}
      <div class="palette">${allowed.map(c=>`<button class="blk ${CMD[c].t}" type="button" data-c="${c}">${CMD[c].t==='slide'?ARROW[c]+' '+CMD[c].name.replace('으로 밀기',''):CMD[c].icon+' '+CMD[c].name}</button>`).join('')}</div>
      <div class="console"><span>&gt;_</span><input id="cmdIn" type="text" autocomplete="off" placeholder="말로 명령: 오른쪽 3, 시계 90, 좌우 뒤집기, 실행" aria-label="말로 명령하기"><button type="button" id="cmdGo">입력</button></div>
    </div></div>`;
  const svg = box.querySelector('.board'), gPos = svg.querySelector('.pos'), gSq = svg.querySelector('.squash'), gOr = svg.querySelector('.orient');
  let angle = 0, sx = 1;
  function setPose(st, instant){ if(instant) svg.classList.add('no-anim'); gPos.style.transform = `translate(${st.x*C}px,${st.y*C}px)`; gOr.style.transform = `translate(${1.5*C}px,${1.5*C}px) rotate(${angle}deg) scale(${sx},1) translate(${-1.5*C}px,${-1.5*C}px)`; if(instant){ void svg.getBoundingClientRect(); svg.classList.remove('no-anim'); } }
  function resetPose(){ cur = {...start}; angle = start.r*90; sx = start.f?-1:1; setPose(cur, true); }
  resetPose();
  const progEl = box.querySelector('#prog');
  function drawProg(){ progEl.innerHTML = prog.map((b,i)=>`<button class="blk ${CMD[b.c].t}" type="button" data-i="${i}" title="눌러서 빼기">${blockLabel(b)} <span class="x">✕</span></button>`).join(''); progEl.querySelectorAll('.blk').forEach(el=>el.onclick=()=>{ if(running||api.locked) return; prog.splice(+el.dataset.i,1); drawProg(); Game.Sound.tick(); }); }
  function add(c, n){ if(running||api.locked) return; if(prog.length>=12){ Game.toast('블록은 12개까지예요'); return; } prog.push({c, n: CMD[c].t==='slide' ? (n||nSlide) : 1}); drawProg(); Game.Sound.pop(); }
  box.querySelectorAll('.palette .blk').forEach(b=>b.onclick=()=>add(b.dataset.c));
  const nv = box.querySelector('#nVal'); if(nv){ box.querySelector('#nMinus').onclick=()=>{ nSlide=Math.max(1,nSlide-1); nv.textContent=nSlide; }; box.querySelector('#nPlus').onclick=()=>{ nSlide=Math.min(5,nSlide+1); nv.textContent=nSlide; }; }
  box.querySelector('#clrBtn').onclick=()=>{ if(running) return; prog=[]; drawProg(); resetPose(); };
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  async function run(){
    if(running||api.locked) return; if(!prog.length){ Game.toast('먼저 블록을 넣어 주세요'); return; }
    running = true; resetPose(); await sleep(250); let hitWall = false;
    for(let i=0;i<prog.length;i++){
      const b = prog[i]; progEl.querySelectorAll('.blk').forEach((el,k)=>el.classList.toggle('run', k===i));
      const nx = apply(cur, b);
      if(!inside(nx)){ hitWall = true; svg.classList.add('wall-hit'); Game.Sound.bad(); await sleep(450); svg.classList.remove('wall-hit'); break; }
      if(CMD[b.c].t==='slide'){ cur = nx; setPose(cur); Game.Sound.tick(); await sleep(520); }
      else if(CMD[b.c].t==='rot'){ angle += b.c==='cw90'?90:b.c==='cw180'?180:-90; cur = nx; setPose(cur); Game.Sound.whoosh(); await sleep(560); }
      else { // 뒤집기: 납작해졌다가 펴짐
        gSq.style.transform = `translate(${1.5*C}px,${1.5*C}px) scale(${b.c==='fh'?0.02:1},${b.c==='fv'?0.02:1}) translate(${-1.5*C}px,${-1.5*C}px)`; Game.Sound.whoosh(); await sleep(260);
        cur = nx; angle = cur.r*90; sx = cur.f?-1:1; setPose(cur, true);
        gSq.style.transform = ''; await sleep(320);
      }
    }
    progEl.querySelectorAll('.blk').forEach(el=>el.classList.remove('run'));
    running = false;
    api.submit({st:cur, wall:hitWall, blocks:prog.length});
    if(!api.locked) setTimeout(()=>{ if(!api.locked) resetPose(); }, 900);
  }
  box.querySelector('#runBtn').onclick = run;
  // 말로 명령하기 (규칙 해석기)
  const cin = box.querySelector('#cmdIn');
  function parse(t){
    t = t.replace(/\s+/g,' ').trim(); const num = (t.match(/\d+/)||[])[0];
    if(/실행|시작|run/i.test(t)) return {run:true};
    if(/지워|처음|초기|리셋/.test(t)) return {clear:true};
    if(/뒤집/.test(t)){ if(/위|아래|상하/.test(t)) return {c:'fv'}; return {c:'fh'}; }
    if(/반대/.test(t) && /90|돌/.test(t)) return {c: num==='270'?'cw90':'ccw90'};
    if(/시계|돌려|돌리/.test(t)){ if(num==='180') return {c:'cw180'}; if(num==='270') return {c:'ccw90'}; return {c:'cw90'}; }
    const n = Math.max(1, Math.min(5, +(num||1)));
    if(/오른/.test(t)) return {c:'right', n}; if(/왼/.test(t)) return {c:'left', n}; if(/위/.test(t)) return {c:'up', n}; if(/아래|밑/.test(t)) return {c:'down', n};
    return null;
  }
  function doCmd(){
    const t = cin.value.trim(); if(!t) return; cin.value='';
    const p = parse(t);
    if(!p){ Game.say(`"${esc(t)}"는 아직 못 알아들었어요. <b>오른쪽 3</b>, <b>위 2</b>, <b>시계 90</b>, <b>시계 반대 90</b>, <b>좌우 뒤집기</b>, <b>상하 뒤집기</b>, <b>실행</b>처럼 말해 주세요.`, 'think'); return; }
    if(p.run){ run(); return; } if(p.clear){ prog=[]; drawProg(); resetPose(); Game.say('코드를 모두 지웠어요.', 'happy'); return; }
    if(!allowed.includes(p.c)){ Game.say(`이번 미션에서는 <b>${CMD[p.c].name}</b> 블록을 쓸 수 없어요.`, 'wow'); return; }
    add(p.c, p.n); Game.say(`알아들었어요! <b>${blockLabel({c:p.c, n:p.n||1})}</b> 블록을 넣었어요.`, 'happy');
  }
  box.querySelector('#cmdGo').onclick = doCmd; cin.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); doCmd(); } });
  drawProg();
  return {goalKey};
}
function codingCheck(goal, minBlocks){
  const gk = key(goal);
  return v=>{
    if(!v || !v.st) return false;
    if(v.wall) return '조각이 무대 밖으로 나가려고 해서 멈췄어요. 칸 수를 줄여 보세요.';
    if(key(v.st)===gk){ return true; }
    const sameShape = key({...v.st, x:goal.x, y:goal.y})===key(goal);
    if(sameShape){ const dx = goal.x - v.st.x, dy = goal.y - v.st.y; const parts=[]; if(dx) parts.push(`${dx>0?'오른쪽':'왼쪽'}으로 ${Math.abs(dx)}칸`); if(dy) parts.push(`${dy>0?'아래쪽':'위쪽'}으로 ${Math.abs(dy)}칸`); return `방향은 딱 맞아요! 위치만 ${parts.join(', ')} 더 가야 해요.`; }
    // 같은 자리에서 방향 비교
    for(const r of [1,2,3]){ const t={...v.st, r:(v.st.r+r)%4}; if(key({...t,x:goal.x,y:goal.y})===gk) return `모양이 목표와 다르게 돌아가 있어요. 시계 방향으로 ${r*90}°를 더 돌리면 맞아요.`; }
    return '모양이 목표와 다르게 뒤집혀 있어요. 뒤집기 블록이 필요해요. 조각의 눈 위치를 목표와 비교해 보세요.';
  };
}
function makePuzzle(allowed, minD, maxD, shape){
  for(let tries=0; tries<400; tries++){
    const start = {shape: shape||pick(Object.keys(SHAPES)), x:rand(0,W-3), y:rand(0,H-3), f:0, r:rand(0,3)};
    let s = {...start}; const k = rand(minD, maxD);
    for(let i=0;i<k;i++){ const c = pick(allowed); const b = {c, n: CMD[c].t==='slide'?rand(1,4):1}; const t = apply(s,b); if(inside(t)) s = t; }

function codingQ({allowed, minD, maxD, title, kicker, say, shape, solutionNote}){
  const pz = makePuzzle(allowed, minD, maxD, shape);
  // 최단 코드 하나 찾기 (풀이용)
  const sol = solvePath(pz.start, key(pz.goal), allowed);
  return { kicker, title, say,
    render(box, api){ codingWidget(box, api, {start:pz.start, goal:pz.goal, allowed, minBlocks:pz.min}); },
    check: codingCheck(pz.goal, pz.min),
    hint:'목표 자리와 초록 조각의 눈 위치를 비교해 보세요.',
    solution:`가장 짧은 코드 예: ${sol.map(b=>`<span class="blk ${CMD[b.c].t}" style="display:inline-flex;margin:2px">${blockLabel(b)}</span>`).join(' ')}<br>${solutionNote||'같은 결과를 내는 코드는 여러 가지일 수 있어요.'}`,
    praise: '' , _min: pz.min };
}
function solvePath(start, gk, allowed){
  const q=[[start,[]]], seen=new Set([key(start)+start.x+','+start.y]);
  while(q.length){ const [s,path]=q.shift(); if(key(s)===gk) return path;
    for(const c of allowed){ for(const b of (CMD[c].t==='slide'?[1,2,3,4,5].map(n=>({c,n})):[{c,n:1}])){ const t=apply(s,b); if(!inside(t)) continue; const k=key(t)+t.x+','+t.y; if(seen.has(k)) continue; seen.add(k); q.push([t,[...path,b]]); } } }
  return [];
}

    check:v=>{ if(v===target) return true; const d = target - v; return `빗나갔어요! 목표는 지금보다 <b>${Math.abs(d)}°</b> ${d>0?'더 크게(왼쪽 위로)':'더 작게(오른쪽 아래로)'} 돌려야 해요.`; },
    solution:`목표 수정은 바닥선에서 <b>${target}°</b> 방향에 있어요. 각도기의 안쪽 눈금 0에서 시작해 ${target}까지 세어요.`,
    praise:`정확히 ${target}°!` };
}
/* ---------- 미션 6: 각도 탐정 ---------- */
function triFig(A,B,Cq){ // 밑변 위 두 각 A,B, 꼭대기 C
  const Lb=360, ox=80, oy=260; const a=deg2(A), b=deg2(B);
  const t = Math.sin(b)/Math.sin(a+b); const px = ox + Lb*t*Math.cos(a), py = oy - Lb*t*Math.sin(a);
  const k = Math.min(1, 220/(oy-py)); // 너무 높으면 줄이기
  const P=[[ox,oy],[ox+Lb,oy],[px,py]].map(([x,y])=>[ox+(x-ox)*k+ (1-k)*90, oy-(oy-y)*k]);
  const lab=(p,q,r,txt,cls)=>{ const mx=(q[0]+r[0])/2-p[0], my=(q[1]+r[1])/2-p[1]; const m=Math.hypot(mx,my)||1; return `<text x="${p[0]+mx/m*44}" y="${p[1]+my/m*44+7}" text-anchor="middle" class="${cls||''}">${txt}</text>`; };
  return `<svg class="geo" viewBox="0 0 520 300"><polygon class="shape" points="${P.map(p=>p.join(',')).join(' ')}"/>${lab(P[0],P[1],P[2],A+'°')}${lab(P[1],P[0],P[2],B+'°')}${lab(P[2],P[0],P[1],Cq,'q')}</svg>`;
}
function quadAngles(){ for(let t=0;t<200;t++){ const a=[rand(60,140),rand(60,140),rand(60,140)]; const d=360-a[0]-a[1]-a[2]; if(d>=55&&d<=150) return [...a,d]; } return [90,100,80,90]; }
function quadFig(angs, qi){
  // 외각만큼 돌며 변을 그리고, 마지막 두 변 길이는 풀어서 닫기
  for(let tries=0;tries<60;tries++){
    const dirs=[]; let h=0; for(let k=0;k<4;k++){ dirs.push(h); h += 180-angs[(k+1)%4]; }
    const s1=rand(180,280), s2=rand(140,240); const d=dirs.map(x=>[Math.cos(deg2(x)), -Math.sin(deg2(x))]);
    const bx=-(s1*d[0][0]+s2*d[1][0]), by=-(s1*d[0][1]+s2*d[1][1]); const det=d[2][0]*d[3][1]-d[2][1]*d[3][0]; if(Math.abs(det)<1e-6) continue;
    const s3=(bx*d[3][1]-by*d[3][0])/det, s4=(d[2][0]*by-d[2][1]*bx)/det; if(s3<80||s4<80) continue;
    const pts=[[0,0]]; [s1,s2,s3].forEach((s,k)=>{ const p=pts[pts.length-1]; pts.push([p[0]+s*d[k][0], p[1]+s*d[k][1]]); });
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys);
    const sc=Math.min(420/(mxx-mnx), 240/(mxy-mny)); const P=pts.map(([x,y])=>[50+(x-mnx)*sc+(420-(mxx-mnx)*sc)/2, 30+(y-mny)*sc]);
    // 꼭짓점 k의 각: P[k]에서. 그린 순서상 P0의 내각 = angs[0]
    const lab=(k)=>{ const p=P[k], q=P[(k+3)%4], r=P[(k+1)%4]; const mx=(q[0]+r[0])/2-p[0], my=(q[1]+r[1])/2-p[1]; const m=Math.hypot(mx,my)||1; const txt = k===qi?'?':angs[k]+'°'; return `<text x="${p[0]+mx/m*42}" y="${p[1]+my/m*42+7}" text-anchor="middle" class="${k===qi?'q':''}">${txt}</text>`; };
    return `<svg class="geo" viewBox="0 0 520 300"><polygon class="shape" points="${P.map(p=>p.join(',')).join(' ')}"/>${[0,1,2,3].map(lab).join('')}</svg>`;
  }
  return '';
}
function fan(a,b,c){ // 세 각을 한 점에 모으면 일직선
  const cx=260, cy=170, R=120; let s=0; const cols=['#4fd6aa','#ffc23d','#ff8fa3']; let out='';
  [a,b,c].forEach((v,k)=>{ const s0=s, s1=s+v; out+=`<path d="M${cx} ${cy} L${cx+R*Math.cos(deg2(180-s0))} ${cy-R*Math.sin(deg2(180-s0))} A${R} ${R} 0 0 1 ${cx+R*Math.cos(deg2(180-s1))} ${cy-R*Math.sin(deg2(180-s1))} Z" fill="${cols[k]}" stroke="#fff" stroke-width="3"/><text x="${cx+75*Math.cos(deg2(180-s0-v/2))}" y="${cy-75*Math.sin(deg2(180-s0-v/2))+7}" text-anchor="middle" font-weight="800" font-size="18" fill="#0b2a26">${v}°</text>`; s=s1; });
  return `<svg class="geo" viewBox="0 0 520 190" style="max-width:420px">${out}<line x1="${cx-150}" y1="${cy}" x2="${cx+150}" y2="${cy}" stroke="#087a5d" stroke-width="4"/><text x="${cx}" y="${cy+0}" dy="-130" text-anchor="middle" font-size="16" fill="#087a5d" font-weight="800">세 각을 모으면 일직선 = 180°</text></svg>`;
}
function m6(i){
  if(i===0||i===2){
    const A1=rand(35,85), B1=rand(35,85), C1=180-A1-B1;
    return { kicker:'삼각형의 세 각', title:'삼각형에서 <em>?</em>의 각도를 구하세요.',
      say: i===0 ? '탐정 수리 출동! 삼각형의 세 각을 모두 더하면 몇 도였는지 기억나요?' : null,
      render(box, api){ box.innerHTML = triFig(A1,B1,'?'); api.input(box, {placeholder:'?', unit:'°', sm:true}); },
      check:v=> v===C1 ? true : (v===360-A1-B1 ? '그건 사각형일 때예요! 삼각형의 세 각의 합은 180°예요.' : `삼각형의 세 각의 합은 180°예요. 180° − ${A1}° − ${B1}°를 계산해 보세요.`),
      after(box){ box.innerHTML = fan(A1,B1,C1); },
      solution:`${fan(A1,B1,C1)}180° − ${A1}° − ${B1}° = <b>${C1}°</b>` };
  }
  if(i===1||i===3){
    const ang = quadAngles(), qi = rand(0,3), ans = ang[qi];
    return { kicker:'사각형의 네 각', title:'사각형에서 <em>?</em>의 각도를 구하세요.',
      render(box, api){ box.innerHTML = quadFig(ang, qi); api.input(box, {placeholder:'?', unit:'°', sm:true}); },
      check:v=> v===ans ? true : (v===180-(360-ans) ? '그건 삼각형일 때예요! 사각형은 삼각형 2개로 나눌 수 있어서 네 각의 합은 360°예요.' : '사각형은 삼각형 2개로 나눌 수 있어요. 그래서 네 각의 합은 180° × 2 = 360°예요.'),
      hint:'사각형의 네 각의 합은 360°예요.',
      solution:`사각형의 네 각의 합은 <b>360°</b>예요. 360° − ${ang.filter((x,k)=>k!==qi).map(x=>x+'°').join(' − ')} = <b>${ans}°</b>` };
  }
  return null;
}
